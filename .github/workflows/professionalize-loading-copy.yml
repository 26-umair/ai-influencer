name: Professionalize Loading Copy

on:
  push:
    branches:
      - submission-ready-polish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Replace loading messages and verify build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: submission-ready-polish
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Replace casual loading messages
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/pages/Create.jsx')
          text = path.read_text(encoding='utf-8')
          marker = 'const LOADING_MESSAGES = ['
          start = text.index(marker)
          array_start = text.index('[', start)

          i = array_start
          depth = 0
          quote = None
          escape = False
          line_comment = False
          block_comment = False
          end = None

          while i < len(text):
              ch = text[i]
              nxt = text[i + 1] if i + 1 < len(text) else ''

              if quote:
                  if escape:
                      escape = False
                  elif ch == '\\':
                      escape = True
                  elif ch == quote:
                      quote = None
              elif line_comment:
                  if ch == '\n':
                      line_comment = False
              elif block_comment:
                  if ch == '*' and nxt == '/':
                      block_comment = False
                      i += 1
              else:
                  if ch == '/' and nxt == '/':
                      line_comment = True
                      i += 1
                  elif ch == '/' and nxt == '*':
                      block_comment = True
                      i += 1
                  elif ch in ("'", '"', '`'):
                      quote = ch
                  elif ch == '[':
                      depth += 1
                  elif ch == ']':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              i += 1

          if end is None:
              raise SystemExit('Could not locate LOADING_MESSAGES array end')

          new_messages = [
              'Analyzing the creator brief and selected niche...',
              'Building a consistent fictional identity...',
              'Preparing visual direction for the target audience...',
              'Translating persona details into generation prompts...',
              'Checking age and safety constraints before generation...',
              'Aligning appearance, backstory, and campaign tone...',
              'Generating campaign-ready visual variations...',
              'Optimizing composition for social media use...',
              'Maintaining consistency across the selected looks...',
              'Preparing a brand-safe creator asset...',
              'Reviewing reference guidance and style notes...',
              'Balancing realism with a clearly fictional creator identity...',
              'Creating reusable visuals for future campaigns...',
              'Refining details for a polished presentation...',
              'Finalizing outputs for review and selection...',
              'Estimated generation time is {est}; thank you for waiting.',
              'Preparing the creator profile for your workspace...',
              'Keeping the result aligned with responsible AI guidelines...',
          ]

          replacement = 'const LOADING_MESSAGES = [\n' + ''.join(f"  {msg!r},\n" for msg in new_messages) + ']'
          new_text = text[:start] + replacement + text[end:]
          path.write_text(new_text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

      - name: Remove one-time workflow and commit changes
        run: |
          rm .github/workflows/professionalize-loading-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Create.jsx .github/workflows/professionalize-loading-copy.yml
          if git diff --cached --quiet; then
            echo "No loading-copy changes needed."
          else
            git commit -m "Professionalize generation loading messages"
            git push origin HEAD:submission-ready-polish
          fi
